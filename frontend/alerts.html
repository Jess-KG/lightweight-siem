<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/static/css/style_2.css">
    <title>Alerts - SIEM Dashboard</title>
</head>

<body>
    <header>
        <h1>Lightweight SIEM</h1>
        <h2>Event Viewer</h2>
        <nav>
            <a href="/events">Events</a>
            <a href="/alerts" class="active">Alerts</a>
        </nav>
    </header>
    <main>
        <h2>Alert Center</h2>
        <div class="controls">
            <input type="text" id="search-box" placeholder="Search alerts...">

            <select id="severity-select">
                <option value="">All severities</option>
                <option value="critical">Critical</option>
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
            </select>

            <select id="rule-select">
                <option value="">All rules</option>
            </select>
        </div>

        <div class="stat-cards">
            <div class="stat-card" id="card-critical" data-severity="critical">
                <div class="stat-card-label severity-critical">Critical</div>
                <div class="stat-card-value" id="count-critical">0</div>
            </div>
            <div class="stat-card" id="card-high" data-severity="high">
                <div class="stat-card-label severity-high">High</div>
                <div class="stat-card-value" id="count-high">0</div>
            </div>
            <div class="stat-card" id="card-medium" data-severity="medium">
                <div class="stat-card-label severity-medium">Medium</div>
                <div class="stat-card-value" id="count-medium">0</div>
            </div>
            <div class="stat-card" id="card-low" data-severity="low">
                <div class="stat-card-label severity-low">Low</div>
                <div class="stat-card-value" id="count-low">0</div>
            </div>
        </div>

        <div class="panel-row">
            <div class="panel">
                <div class="panel-title">Alert Trend (by hour)</div>
                <canvas id="trend-canvas"></canvas>
            </div>

            <div class="panel">
                <div class="panel-title">Alert Distribution</div>
                <canvas id="distribution-canvas"></canvas>
            </div>
        </div>
        <h3>Alerts</h3>
        <p class="hint-text">Click any alert to see the full investigation details.</p>

        <div id="alert-list">
            <p>Loading...</p>
        </div>
    </main>

    <div id="alert-modal-overlay" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <span id="modal-title">Alert Details</span>
                <button id="modal-close-btn" class="modal-close-btn">&times;</button>
            </div>

            <div class="modal-body">
                <div class="modal-section">
                    <h4>Summary</h4>
                    <table class="modal-table" id="modal-summary-table"></table>
                </div>

                <div class="modal-section">
                    <h4>Normalized Event Fields</h4>
                    <table class="modal-table" id="modal-normalized-table"></table>
                </div>

                <div class="modal-section">
                    <h4>Raw Event Data</h4>
                    <pre id="modal-raw-data"></pre>
                </div>
            </div>
        </div>
    </div>
    <script>
        let allAlerts = [];

        let trendChart = null;
        let distributionChart = null;

        let currentSeverity = "";
        let currentRule = "";
        let currentSearch = "";
        let clickedSeverity = "";

        async function loadAlerts() {
            const response = await fetch("/api/alerts");
            const data = await response.json();

            allAlerts = data.alerts;

            fillRuleDropdown();
            applyFilters();
        }

        function fillRuleDropdown() {
            const select = document.getElementById("rule-select");

            let rules = [];
            for (let i = 0; i < allAlerts.length; i++) {
                let r = allAlerts[i].rule;
                if (!rules.includes(r)) {
                    rules.push(r);
                }
            }

            for (let i = 0; i < rules.length; i++) {
                let option = document.createElement("option");
                option.value = rules[i];
                option.innerText = rules[i];
                select.appendChild(option);
            }
        }

        function applyFilters() {
            let filtered = [];
            currentSeverity = document.getElementById("severity-select").value.toLowerCase();
            currentSearch = document.getElementById("search-box").value.toLowerCase();
            currentRule = document.getElementById("rule-select").value.toLowerCase();

            for (let i = 0; i < allAlerts.length; i++) {
                let a = allAlerts[i];

                if (clickedSeverity != "" && a.severity != clickedSeverity) {
                    continue;
                }
                else if (currentSeverity !== "" && a.severity !== currentSeverity) {
                    continue;
                }

                if (currentRule !== "" && a.rule !== currentRule) {
                    continue;
                }

                let combined = (a.rule || "") + " " + (a.message || "") + " " + (a.computer || "");
                combined = combined.toLowerCase();

                if (currentSearch !== "" && !combined.includes(currentSearch)) {
                    continue;
                }

                filtered.push(a);
            }

            updateStatCards(filtered);
            drawTrendChart(filtered);
            drawDistributionChart(filtered)
            showAlertList(filtered);
        }

        function updateStatCards(alerts) {
            let counts = { critical: 0, high: 0, medium: 0, low: 0 };

            for (let i = 0; i < alerts.length; i++) {
                let sev = alerts[i].severity;
                if (counts[sev] !== undefined) {
                    counts[sev]++;
                }
            }

            document.getElementById("count-critical").innerText = counts.critical;
            document.getElementById("count-high").innerText = counts.high;
            document.getElementById("count-medium").innerText = counts.medium;
            document.getElementById("count-low").innerText = counts.low;
        }

        function drawTrendChart(alerts) {
            let hourlyCounts = {};

            for (let i = 0; i < alerts.length; i++) {
                let time = new Date(alerts[i].timestamp);

                if (isNaN(time.getTime())) {
                    continue;
                }

                let hour = time.getHours().toString().padStart(2, "0") + ":00";

                if (hourlyCounts[hour] === undefined) {
                    hourlyCounts[hour] = 0;
                }

                hourlyCounts[hour]++;
            }

            let labels = Object.keys(hourlyCounts).sort();
            let values = [];

            for (let i = 0; i < labels.length; i++) {
                values.push(hourlyCounts[labels[i]]);
            }

            if (trendChart !== null) {
                trendChart.destroy();
            }

            let ctx = document.getElementById("trend-canvas");

            trendChart = new Chart(ctx, {
                type: "line",
                data: {
                    labels: labels,
                    datasets: [{
                        label: "Alerts",
                        data: values,
                        borderWidth: 2,
                        tension: 0.3,
                        fill: false
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,

                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                stepSize: 1
                            }
                        }
                    },

                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                }
            });
        }


        function drawDistributionChart(alerts) {
            let counts = {
                critical: 0,
                high: 0,
                medium: 0,
                low: 0
            };

            for (let i = 0; i < alerts.length; i++) {
                let severity = alerts[i].severity;

                if (counts[severity] !== undefined) {
                    counts[severity]++;
                }
            }

            if (distributionChart !== null) {
                distributionChart.destroy();
            }

            let ctx = document.getElementById("distribution-canvas");

            distributionChart = new Chart(ctx, {
                type: "doughnut",

                data: {
                    labels: [
                        "Critical",
                        "High",
                        "Medium",
                        "Low"
                    ],

                    datasets: [{
                        data: [
                            counts.critical,
                            counts.high,
                            counts.medium,
                            counts.low
                        ],

                        borderWidth: 1
                    }]
                },

                options: {
                    responsive: true,
                    maintainAspectRatio: false,

                    plugins: {
                        legend: {
                            position: "right"
                        }
                    }
                }
            });
        }

        function showAlertList(alerts) {
            const wrap = document.getElementById("alert-list");
            wrap.innerHTML = "";

            if (alerts.length === 0) {
                wrap.innerHTML = "<p>No alerts found.</p>";
                return;
            }

            // dot emoji per severity, just for a quick visual cue
            let dots = { critical: "🔴", high: "🟠", medium: "🟡", low: "🔵" };

            for (let i = 0; i < alerts.length; i++) {
                let a = alerts[i];
                let dot = dots[a.severity] || "⚪";

                let row = document.createElement("div");
                row.className = "alert-row";
                row.innerHTML = `
          <span>${dot}</span>
          <span class="alert-severity severity-${a.severity}">${a.severity.toUpperCase()}</span>
          <span class="alert-rule">${a.rule}</span>
          <span class="alert-message">${a.message}</span>
          <span class="alert-computer">${a.computer || "-"}</span>
          <span class="alert-time">${a.timestamp || "-"}</span>
        `;
                row.addEventListener("click", function () {
                    openAlertModal(a);
                });
                wrap.appendChild(row);
            }
        }

        function openAlertModal(alert) {
            document.getElementById("modal-title").innerText = alert.rule;

            // summary table: the top-level alert fields you already see in the list
            const summaryTable = document.getElementById("modal-summary-table");
            summaryTable.innerHTML = `
                <tr><td>Severity</td><td class="severity-${alert.severity}">${alert.severity.toUpperCase()}</td></tr>
                <tr><td>Rule</td><td>${alert.rule}</td></tr>
                <tr><td>Message</td><td>${alert.message}</td></tr>
                <tr><td>Timestamp</td><td>${alert.timestamp || "-"}</td></tr>
                <tr><td>Computer</td><td>${alert.computer || "-"}</td></tr>
            `;

            // normalized fields table: everything on the event EXCEPT the raw "data" blob
            const normalizedTable = document.getElementById("modal-normalized-table");
            normalizedTable.innerHTML = "";

            const event = alert.event || {};
            let hasNormalizedFields = false;

            for (let key in event) {
                if (key === "data") continue;  // raw data gets its own section below
                if (event[key] === null || event[key] === undefined || event[key] === "") continue;

                hasNormalizedFields = true;
                let row = document.createElement("tr");
                row.innerHTML = `<td>${key}</td><td>${event[key]}</td>`;
                normalizedTable.appendChild(row);
            }

            if (!hasNormalizedFields) {
                normalizedTable.innerHTML = "<tr><td colspan='2'>No normalized fields available</td></tr>";
            }

            // raw data: exactly what came off the wire, pretty-printed
            const rawDataBox = document.getElementById("modal-raw-data");
            if (event.data && Object.keys(event.data).length > 0) {
                rawDataBox.innerText = JSON.stringify(event.data, null, 2);
            } else {
                rawDataBox.innerText = "No raw data available for this event.";
            }

            document.getElementById("alert-modal-overlay").classList.add("modal-visible");
        }

        function closeAlertModal() {
            document.getElementById("alert-modal-overlay").classList.remove("modal-visible");
        }

        document.getElementById("modal-close-btn").addEventListener("click", closeAlertModal);

        // click the dark background outside the box to close it too
        document.getElementById("alert-modal-overlay").addEventListener("click", function (e) {
            if (e.target === this) closeAlertModal();
        });

        // Escape key closes it
        document.addEventListener("keydown", function (e) {
            if (e.key === "Escape") closeAlertModal();
        });
        document.getElementById("search-box").addEventListener("input", applyFilters);

        document.getElementById("severity-select").addEventListener("change", applyFilters);

        document.getElementById("rule-select").addEventListener("change", applyFilters);

        document.querySelectorAll('.stat-card').forEach(card => {
            card.addEventListener('click', () => {

                if (clickedSeverity === card.dataset.severity) {
                    clickedSeverity = "";
                    card.classList.remove("stat-card-active");
                }
                else {
                    clickedSeverity = card.dataset.severity.toLowerCase();

                    // Remove active class from all cards
                    document.querySelectorAll('.stat-card').forEach(c => {
                        c.classList.remove("stat-card-active");
                    });

                    // Add active class to clicked card
                    card.classList.add("stat-card-active");
                }

                applyFilters();
            });
        });

        loadAlerts();
    </script>
</body>

</html>
